name: Kemnaker Magang Reminder (Scheduler)

# GitHub Actions hanya bertugas MEMICU endpoint di Vercel.
# (Vercel Hobby hanya mengizinkan cron 1x/hari, sedangkan kita butuh 3x/hari.)
on:
  schedule:
    - cron: '30 2 * * 1-5'   # 09:30 WIB - sync pagi
    - cron: '30 8 * * 1-5'   # 15:30 WIB - WhatsApp reminder
    - cron: '0 14 * * 1-5'   # 21:00 WIB - Email mentor & peserta
  workflow_dispatch:
    inputs:
      job:
        description: 'Job yang dijalankan'
        required: true
        default: night
        type: choice
        options: [morning, afternoon, night]

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Tentukan job
        run: |
          case "${{ github.event.schedule }}" in
            "30 2 * * 1-5") JOB=morning ;;
            "30 8 * * 1-5") JOB=afternoon ;;
            "0 14 * * 1-5") JOB=night ;;
            *) JOB="${{ github.event.inputs.job }}" ;;
          esac
          echo "JOB=$JOB" >> "$GITHUB_ENV"

      - name: Panggil endpoint Vercel
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "Menjalankan job: $JOB"
          curl -fsS --retry 2 --retry-delay 15 --max-time 300 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/$JOB"
